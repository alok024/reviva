name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: build + smoke (no keys, mock mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Smoke test (core flow in mock mode)
        run: npm run smoke
